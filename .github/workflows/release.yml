name: release-asset

# Attaches a skill-only ZIP (SKILL.md + scripts/ + references/) to every published release,
# for standalone installs and for upload in the Claude apps.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  skill-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugins/secret-preflight/.claude-plugin/plugin.json'))['version'])")
          if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} does not match plugin.json version $version"; exit 1
          fi

      - name: Self-test
        run: python3 plugins/secret-preflight/skills/secret-preflight/scripts/selftest.py

      - name: Build skill-only ZIP
        run: |
          cd plugins/secret-preflight/skills
          zip -r "$GITHUB_WORKSPACE/secret-preflight-skill.zip" secret-preflight -x '*/__pycache__/*'

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" secret-preflight-skill.zip --clobber
